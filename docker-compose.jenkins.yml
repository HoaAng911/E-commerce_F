version: '3.8'

services:
  # Service 1: Docker Daemon (DinD) để xử lý các lệnh build/run docker
  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    ports:
      - "2376:2376"
    networks:
      jenkins:
        aliases:
          - docker
    command: --storage-driver overlay2

  # Service 2: Jenkins Server
  my-jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins  # Chỉ định chính xác file Dockerfile của bạn
    image: my-jenkins:latest
    container_name: shoes_jenkins
    restart: on-failure
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      - .:/var/jenkins_home/workspace/SHOES_STORE
    ports:
      - "8080:8080"
      - "50000:50000"
    networks:
      - jenkins

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins-docker-certs:
  jenkins-data: